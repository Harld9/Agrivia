## docker-compose.yml — Agrivia : stack LOCALE (broker MQTT + simulateurs)
##
## Le backend est déployé sur Render (voir render.yaml).
## Les gateways s'y connectent via la variable BACKEND_WS_URL,
## définie dans le fichier .env à la racine du repo.
##
## Lancer :  docker compose up --build

services:

  # Broker MQTT — simule le Raspberry Pi (broker local)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: agrivia_mosquitto
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket MQTT (optionnel)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - agrivia_net
    restart: unless-stopped

  # ── Serre 01 ──────────────────────────────────────────────────────────────

  # Gateway — relais MQTT -> WebSocket vers le backend Render
  gateway_sim:
    build: ./simulators/gateway
    container_name: agrivia_gateway
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      BACKEND_WS_URL: ${BACKEND_WS_URL:?Renseigne BACKEND_WS_URL dans le fichier .env (URL du backend Render)}
      SERRE_ID: serre_01
      RASPBERRY_ID: rpi_01
      AUTH_TOKEN: RASPBERRY_SECRET_TOKEN
    depends_on:
      - mosquitto
    networks:
      - agrivia_net
    restart: unless-stopped

  # Simulateur ESP32 n°1
  esp32_sim_1:
    build: ./simulators/esp32
    container_name: agrivia_esp32_001
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      SERRE_ID: serre_01
      ESP_ID: esp32_001
      SEND_INTERVAL: "10"   # secondes entre chaque mesure
    depends_on:
      - mosquitto
    networks:
      - agrivia_net
    restart: unless-stopped

  # Simulateur ESP32 n°2
  esp32_sim_2:
    build: ./simulators/esp32
    container_name: agrivia_esp32_002
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      SERRE_ID: serre_01
      ESP_ID: esp32_002
      SEND_INTERVAL: "10"
    depends_on:
      - mosquitto
    networks:
      - agrivia_net
    restart: unless-stopped

  # ── Serre 02 ──────────────────────────────────────────────────────────────

  # Gateway serre 02 — relais MQTT -> WebSocket vers le backend Render
  gateway_sim_2:
    build: ./simulators/gateway
    container_name: agrivia_gateway_2
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      BACKEND_WS_URL: ${BACKEND_WS_URL:?Renseigne BACKEND_WS_URL dans le fichier .env (URL du backend Render)}
      SERRE_ID: serre_02
      RASPBERRY_ID: rpi_02
      AUTH_TOKEN: RASPBERRY_SECRET_TOKEN
    depends_on:
      - mosquitto
    networks:
      - agrivia_net
    restart: unless-stopped

  # Simulateur ESP32 n°3 (serre 02)
  esp32_sim_3:
    build: ./simulators/esp32
    container_name: agrivia_esp32_003
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      SERRE_ID: serre_02
      ESP_ID: esp32_003
      SEND_INTERVAL: "10"
    depends_on:
      - mosquitto
    networks:
      - agrivia_net
    restart: unless-stopped

  # Simulateur ESP32 n°4 (serre 02)
  esp32_sim_4:
    build: ./simulators/esp32
    container_name: agrivia_esp32_004
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      SERRE_ID: serre_02
      ESP_ID: esp32_004
      SEND_INTERVAL: "10"
    depends_on:
      - mosquitto
    networks:
      - agrivia_net
    restart: unless-stopped

networks:
  agrivia_net:
    driver: bridge
