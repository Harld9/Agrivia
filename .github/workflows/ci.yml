name: CI — Agrivia

# Lance les tests + builds à chaque push sur main et à chaque pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Node.js ────────────────────────────────────────────────────────
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests + couverture
        run: npm run test:coverage

  # ── Frontend React / Vite ──────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests + couverture
        run: npm run test:coverage
      - name: Build
        run: npm run build

  # ── Simulateurs Python ─────────────────────────────────────────────────────
  simulateurs:
    name: Simulateurs — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulators
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulators/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest
