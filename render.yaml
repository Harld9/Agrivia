## render.yaml — Agrivia : déploiement du backend (100 % gratuit)
##
## ARCHITECTURE
##   - Backend Node.js          -> Render (ce fichier) — plan gratuit
##   - Mosquitto + simulateurs  -> en local via docker-compose.yml
##
## DÉPLOIEMENT
##   1. Render Dashboard -> New -> Blueprint
##   2. Sélectionner ce repo GitHub et valider
##   3. Render crée le service "agrivia-backend" et le déploie
##   4. Copier l'URL publique fournie (ex: https://agrivia-backend.onrender.com)
##   5. La reporter dans le fichier .env à la racine du repo (variable
##      BACKEND_WS_URL) pour que les simulateurs locaux s'y connectent.
##
## NOTE : le plan gratuit s'endort après 15 min sans trafic
##        (réveil ~50 s à la requête suivante). Les WebSockets fonctionnent.

services:

  - type: web
    name: agrivia-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/current
    autoDeploy: true
